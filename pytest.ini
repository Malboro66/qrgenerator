[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    --tb=short
    --strict-markers
    -q

markers =
    slow: testes lentos (>2s) — use --slow para incluir
    ui: requerem display tkinter funcional
    windows_only: exclusivos do Windows

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:reportlab
