[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --tb=short --strict-markers -q
markers =
    slow: testes lentos
    ui: requerem display tkinter
    windows_only: exclusivos do Windows
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning:reportlab
